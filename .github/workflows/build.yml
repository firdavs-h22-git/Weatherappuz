name: APK yig'ish

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "project.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyni olish
        uses: actions/checkout@v4

      - name: project.zip ni ochish
        run: |
          if [ ! -f project.zip ]; then
            echo "project.zip topilmadi. Uni repozitoriy asosiga (root) yuklang."
            exit 1
          fi
          mkdir -p work
          unzip -q -o project.zip -d work
          SETTINGS=$(find work -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ZIP ichida settings.gradle.kts topilmadi."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Java 17 ni o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK ni tayyorlash
        uses: android-actions/setup-android@v3

      - name: Gradle ni o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK yig'ish
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Taklifnoma-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
